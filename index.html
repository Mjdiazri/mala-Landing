<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MALA - Cocina de Chengdu</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style.css">

</head>

<body class="mala-hero-body-override">

  <!-- ========================================================= -->
  <!-- PRELOADER -->
  <!-- ========================================================= -->

  <div id="mala-hero-splash-screen" class="mala-hero-splash-overlay">

    <!-- EFECTO DE FUEGO -->
    <div class="mala-hero-ignite-effect" id="mala-hero-igniteEffect"></div>

    <div class="mala-hero-splash-content">

      <!-- Logo -->
      <div class="mala-hero-logo-container">

        <h1 class="mala-hero-logo-title">
          MALA
        </h1>

        <span class="mala-hero-logo-subtitle">
          COCINA DE CHENGDU
        </span>

      </div>

      <!-- Botón interactivo -->

      <div class="mala-hero-hold-container" id="mala-hero-holdBtn">

        <div class="mala-hero-fire-sparks" id="mala-hero-fireSparks"></div>

        <svg class="mala-hero-progress-ring" width="160" height="160">

          <circle class="mala-hero-progress-ring__circle-bg" stroke="#333" stroke-width="3" fill="transparent" r="70"
            cx="80" cy="80" />

          <circle class="mala-hero-progress-ring__circle" id="mala-hero-progressCircle" stroke="#B22222"
            stroke-width="4" fill="transparent" r="70" cx="80" cy="80" />

        </svg>

        <div class="mala-hero-hold-text">

          <p class="mala-hero-hold-main-text">
            MANTÉN <br>
            PRESIONADO
          </p>

          <p class="mala-hero-hold-sub-text">
            para despertar el fuego
          </p>

        </div>

      </div>

    </div>

    <!-- Nubes -->

    <div class="mala-hero-cloud-wrapper mala-hero-cloud-left" id="mala-hero-cloudLeft">

      <img src="img/nube izquierda.png" alt="Nube izquierda">

    </div>

    <div class="mala-hero-cloud-wrapper mala-hero-cloud-right" id="mala-hero-cloudRight">

      <img src="img/nube derecha.png" alt="Nube derecha">

    </div>

  </div>

  <!-- ========================================================= -->
  <!-- HEADER -->
  <!-- ========================================================= -->

  <header>

    <nav class="navbar navbar-expand-lg navbar-dark">

      <div class="container">

        <!-- Logo -->

        <a class="navbar-brand" href="#">

          <img src="img/logo.png" alt="MALA Cocina de Chengdu" class="logo">

        </a>

        <!-- Botón responsive -->

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

          <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menú -->

        <div class="collapse navbar-collapse" id="menu">

          <ul class="navbar-nav mx-auto">

            <li class="nav-item">
              <a class="nav-link active" href="#">Inicio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Menú</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Nosotros</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Contacto</a>
            </li>

          </ul>

        </div>

        <!-- Carrito -->

        <a href="#" class="cart-btn">

          <img src="img/iconos/carrito.png" alt="Carrito" class="cart-icon">

          <span class="cart-badge">
            0
          </span>

        </a>

      </div>

    </nav>

  </header>

  <!-- ========================================================= -->
  <!-- MAIN -->
  <!-- ========================================================= -->

  <main class="main-website">

    <!-- ========================================================= -->
    <!-- HERO -->
    <!-- ========================================================= -->

    <section id="hero">

      <!-- Aquí irá el Hero principal de la página -->
      <!-- Integrar el contenido del Hero -->

    </section>


    <!-- ========================================================= -->
    <!-- MENÚ -->
    <!-- ========================================================= -->

    <section id="menu">

      <!-- Aquí irá la sección de Menú -->
      <!-- Integrar el trabajo de Dannis -->

    </section>


    <!-- ========================================================= -->
    <!-- NOSOTROS -->
    <!-- ========================================================= -->

    <section id="nosotros">

      <!-- Aquí irá la sección Nosotros -->
      <!-- Integrar el trabajo de Mónica -->

    </section>


    <!-- ========================================================= -->
    <!-- CONTACTO -->
    <!-- ========================================================= -->

    <section id="contacto">

      <!-- Aquí irá la sección Contacto -->
      <!-- Integrar el trabajo de Michael -->

    </section>

  </main>


  <!-- ========================================================= -->
  <!-- FOOTER -->
  <!-- ========================================================= -->

  <footer>

    <!-- Aquí irá el footer del proyecto -->

  </footer>


  <!-- ========================================================= -->
  <!-- CARRITO DE COMPRAS -->
  <!-- ========================================================= -->

  <aside class="shopping-cart">

    <!-- ===================================================== -->
    <!-- ENCABEZADO -->
    <!-- ===================================================== -->

    <header class="cart-header">

      <h2 class="cart-title">
        Tu carrito
      </h2>

      <button class="cart-close">

        <img src="img/icons/close.png" alt="Cerrar carrito">

      </button>

    </header>

    <!-- ===================================================== -->
    <!-- PRODUCTOS -->
    <!-- ===================================================== -->

    <div class="cart-items">

      <article class="cart-item">

        <!-- Imagen del producto -->
        <div class="cart-item-image">

          <img src="img/menu/mapo-tofu.jpg" alt="Mapo Tofu">

        </div>

        <!-- Información del producto -->
        <div class="cart-item-info">

          <h3 class="cart-item-title">
            MAPO TOFU
          </h3>

          <p class="cart-item-price">
            $58.000
          </p>

          <!-- Control de cantidad -->
          <div class="quantity-control">

            <button class="quantity-btn minus">
              −
            </button>

            <span class="quantity">
              1
            </span>

            <button class="quantity-btn plus">
              +
            </button>

          </div>

        </div>

        <!-- Eliminar producto -->
        <button class="remove-item">

          <img src="img/icons/delete.png" alt="Eliminar">

        </button>

      </article>

    </div>

    <!-- ===================================================== -->
    <!-- RESUMEN -->
    <!-- ===================================================== -->

    <div class="cart-summary">

      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <span>
          $174.000
        </span>

      </div>

      <div class="summary-row">

        <span>
          Domicilio
        </span>

        <span>
          Gratis
        </span>

      </div>

      <div class="summary-row total">

        <span>
          Total
        </span>

        <span>
          $174.000
        </span>

      </div>

    </div>

    <!-- ===================================================== -->
    <!-- ACCIONES -->
    <!-- ===================================================== -->

    <div class="cart-actions">

      <button class="btn-checkout">

        Finalizar compra

      </button>

      <button class="btn-continue">

        Seguir comprando

      </button>

    </div>

  </aside>

  <!-- ========================================================= -->
  <!-- SCRIPTS -->
  <!-- ========================================================= -->

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>

  <!-- JavaScript del proyecto -->
  <script src="script.js"></script>

</body>

</html>
