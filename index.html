<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mala-Landing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!--Header -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">

      <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="#">
          <img src="img/logo.png" alt="MALA Cocina de Chengdu" class="logo">
        </a>

        <!-- Botón Responsive -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

          <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="menu">

          <ul class="navbar-nav mx-auto">

            <li class="nav-item">
              <a class="nav-link active" href="#">Inicio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Menú</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Nosotros</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Contacto</a>
            </li>
          </ul>
        </div>


        <!-- Carrito -->
        <a href="#" class="cart-btn">

          <img src="img/iconos/carrito.png" alt="Carrito" class="cart-icon">

          <span class="cart-badge">
            0
          </span>

        </a>
      </div>

    </nav>


  </header>

  <main>
    <!--HERO-->
    <section></section>
    <!--menu Dannis-->
    <section></section>
    <!--Sobre nosotros Monica-->
    <section></section>
    <!--Contactanos Michael-->
    <section></section>
  </main>
  <!--Footer-->
  <footer></footer>



  <!-- ==========================================================
     CARRITO DE COMPRAS
=========================================================== -->

  <aside class="shopping-cart">

    <!-- ==========================================
         ENCABEZADO
    =========================================== -->

    <header class="cart-header">

      <h2 class="cart-title">
        Tu carrito
      </h2>

      <button class="cart-close">

        <img src="img/icons/close.png" alt="Cerrar carrito">

      </button>

    </header>

    <!-- ==========================================
         LISTA DE PRODUCTOS
         👇 AQUÍ VA EL CÓDIGO QUE TE DI
    =========================================== -->

    <div class="cart-items">

      <article class="cart-item">

        <div class="cart-item-image">

          <img src="img/menu/mapo-tofu.jpg" alt="Mapo Tofu">

        </div>

        <div class="cart-item-info">

          <h3 class="cart-item-title">
            MAPO TOFU
          </h3>

          <p class="cart-item-price">
            $58.000
          </p>

          <div class="quantity-control">

            <button class="quantity-btn minus">
              −
            </button>

            <span class="quantity">
              1
            </span>

            <button class="quantity-btn plus">
              +
            </button>

          </div>

        </div>

        <button class="remove-item">

          <img src="img/icons/delete.png" alt="Eliminar">

        </button>

      </article>

    </div>

    <!-- ==========================================
         AQUÍ IRÁ EL RESUMEN
         (LO HAREMOS EN EL SIGUIENTE PASO)
    =========================================== -->

    <!-- cart-summary -->

    <div class="cart-summary">

      <!-- Subtotal -->

      <div class="summary-row">

        <span>Subtotal</span>

        <span>$174.000</span>

      </div>

      <!-- Domicilio -->

      <div class="summary-row">

        <span>Domicilio</span>

        <span>Gratis</span>

      </div>

      <!-- Total -->

      <div class="summary-row total">

        <span>Total</span>

        <span>$174.000</span>

      </div>

    </div>

    <!-- ==========================================================
     ACCIONES DEL CARRITO
=========================================================== -->

<div class="cart-actions">

    <button class="btn-checkout">

        Finalizar compra

    </button>

    <button class="btn-continue">

        Seguir comprando

    </button>

</div>

  </aside>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
